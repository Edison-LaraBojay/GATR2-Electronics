" y="443" font-family="Arial, sans-serif" font-size="11" fill="rgb(26,36,51)">Facing inward from opposite walls can</text><text x="459" y="462" font-family="Arial, sans-serif" font-size="11" fill="rgb(26,36,51)">mean 0 deg on one side, 180 deg on the other.</text><text x="38" y="548" font-family="Arial, sans-serif" font-size="11" fill="rgb(26,36,51)">Pose refers to the ROBOT origin near its turning center, not the camera.</text><text x="38" y="568" font-family="Arial, sans-serif" font-size="10" fill="rgb(26,36,51)">Robot axes: +x forward, +y left, +z up. Camera mounting is measured from that robot origin.</text><text x="38" y="588" font-family="Arial, sans-serif" font-size="9" fill="rgb(26,36,51)">Diagram follows config/override/field.xml and docs/coordinates.md. Robot drawings are illustrative.</text></svg>