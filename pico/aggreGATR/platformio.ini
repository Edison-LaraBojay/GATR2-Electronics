; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = aggreGATR
description = RP2040 encoder sender for GATR2
default_envs = hat2_encoder_demo

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#a1df30f
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_extra_dirs = third_party
build_src_flags = -Wall -Wextra
build_src_filter = -<*> +<main.cpp> +<quadrature.cpp> +<../../../encoder-record/encoder_record.cpp>

[env:hat2_bno08x]
build_flags = -DGATR2_HAT_REV=2 -DGATR2_IMU_BNO08X
build_src_filter = +<*> -<main.cpp>

[env:hat2_asm330]
build_flags = -DGATR2_HAT_REV=2 -DGATR2_IMU_ASM330
build_src_filter = +<*> -<main.cpp>
lib_ignore = sh2

; Default main.cpp: two encoder channels to the Pi UART, no IMU.
; Normal Build/Upload uses this environment: pio run / pio run -t upload.
[env:hat2_encoder_demo]
build_flags = -DGATR2_HAT_REV=2 -I$PROJECT_DIR/../../encoder-record
lib_ignore = sh2
