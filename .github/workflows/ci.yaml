name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gtest
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev cmake

      - name: Configure
        run: cmake -S common/tests -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  navigatr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gtest
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev cmake

      - name: Configure
        run: cmake -S pi/navigatr -B build-navigatr

      - name: Build
        run: cmake --build build-navigatr -j

      - name: Run tests
        run: ctest --test-dir build-navigatr --output-on-failure

  format:
    runs-on: ubuntu-latest
    # Advisory for now. clang-format does not run on the current dev machine,
    # so the tree is not formatted yet. Flip this off once it is.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: pip install clang-format==22.1.8

      - name: Check formatting
        run: |
          files=$(find common brain pico pi -type f \( -name '*.h' -o -name '*.cpp' \) \
            -not -path '*/third_party/*' -not -path '*/.pio/*')
          echo "checking:"
          echo "$files"
          clang-format --dry-run --Werror $files

  pico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('pico/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run
        working-directory: pico
