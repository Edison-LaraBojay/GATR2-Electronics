name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Deprecated Pi/runtime applications are excluded.
  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gtest
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev cmake

      - name: Configure
        run: cmake -S brain -B build-brain

      - name: Build
        run: cmake --build build-brain -j

      - name: Run tests
        run: ctest --test-dir build-brain --output-on-failure

  # Pose viewer: wire format and laptop receiver. The Brain publisher tests run
  # in the brain job.
  spectagatr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gtest
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev cmake

      - name: Configure
        run: cmake -S spectaGATR -B build-spectagatr

      - name: Build
        run: cmake --build build-spectagatr -j

      - name: Run tests
        run: ctest --test-dir build-spectagatr --output-on-failure

  pico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('pico/aggreGATR/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: |
          pio run
          pio run -e hat2_bno08x -e hat2_asm330
        working-directory: pico/aggreGATR

      - name: Host tests
        run: |
          cmake -S pico/aggreGATR/tests -B build-pico-tests
          cmake --build build-pico-tests -j
          ctest --test-dir build-pico-tests --output-on-failure

  encoder-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev cmake

      - name: Build and test encoder records
        run: |
          cmake -S encoder-record -B build-encoder-record
          cmake --build build-encoder-record --parallel
          ctest --test-dir build-encoder-record --output-on-failure

      - name: Build Linux relay and run its tests
        run: |
          cmake -S pi/encoder-relay -B build-relay -DENCODER_RELAY_BUILD_TESTS=ON
          cmake --build build-relay --parallel
          ctest --test-dir build-relay --output-on-failure
